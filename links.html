<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作業リンク集｜下町きろくの動画屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:#f7f0e2;color:#1e1006;min-height:100vh;}

/* NAV */
nav{background:#150c02;padding:18px 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a5218;position:sticky;top:0;z-index:100;}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:16px;letter-spacing:.22em;color:#f0ddb0;text-decoration:none;}
.nav-logo span{color:#d4920a;}
.nav-links{display:flex;gap:24px;align-items:center;flex-wrap:wrap;}
.nav-links a{font-size:11px;letter-spacing:.2em;color:rgba(240,221,176,.5);text-decoration:none;}
.nav-links a:hover{color:#d4920a;}
.nav-links a.active{color:#d4920a;}

.wrap{max-width:640px;margin:0 auto;padding:56px 24px;}
.eyebrow{font-size:10px;letter-spacing:.4em;color:#8b6820;font-weight:700;margin:0 0 10px;font-family:'Noto Sans JP',sans-serif;}
h1{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:400;letter-spacing:.1em;margin:0 0 8px;color:#1c0f02;}
.lead{font-size:13px;color:#5a3a10;letter-spacing:.04em;margin-bottom:36px;}

.links{display:flex;flex-direction:column;gap:14px;margin-bottom:40px;}
a.linkcard{
  display:flex;align-items:center;gap:16px;
  background:#fff9ee;border:1px solid #d4b870;border-radius:10px;
  padding:18px 20px;text-decoration:none;color:#1c0f02;
  transition:border-color .15s, transform .15s;
}
a.linkcard:hover{border-color:#c8880a;transform:translateY(-1px);}
a.linkcard:focus-visible{outline:2px solid #c8880a;outline-offset:2px;}
.icon{
  width:44px;height:44px;border-radius:8px;
  background:#c8880a;color:#fff8e8;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.icon svg{width:22px;height:22px;}
.label-group{flex:1;min-width:0;}
.label{font-size:14.5px;font-weight:700;margin:0 0 2px;}
.desc{font-size:12px;color:#8b6820;margin:0;}
.arrow{color:#a09070;font-size:16px;flex-shrink:0;}

.sec-head{font-size:13px;letter-spacing:.15em;color:#8b6820;margin:0 0 14px;padding-bottom:8px;border-bottom:1px solid #d4b870;}
.internal-links{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:40px;}
.internal-links a{
  background:#1c0f02;color:#d4920a;font-size:11px;letter-spacing:.1em;
  padding:6px 14px;border-radius:16px;text-decoration:none;
}
.internal-links a:hover{background:#3a2208;}

footer{font-size:12px;color:#8b6820;text-align:center;line-height:1.7;padding:24px;}

@media(max-width:700px){
  nav{padding:16px 20px;}
  .wrap{padding:40px 16px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">下町きろくの<span>動画屋</span></a>
  <div class="nav-links">
    <a href="tools.html">制作ツール</a>
    <a href="gyomu.html">業務管理</a>
    <a href="shuzai.html">取材ノート</a>
    <a href="hotdog.html">飲食部門</a>
    <a href="links.html" class="active">リンク集</a>
    <a href="index.html#contact">お問い合わせ</a>
  </div>
</nav>

<div class="wrap">
  <p class="eyebrow">下町きろく</p>
  <h1>作業リンク集</h1>
  <p class="lead">サイト運営でよく使うリンクをまとめました。</p>

  <div class="links">
    <a class="linkcard" href="https://claude.ai/code" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 5l-2 14"/></svg>
      </span>
      <span class="label-group">
        <p class="label">Claude Codeで更新</p>
        <p class="desc">サイトの文章や動画を編集する</p>
      </span>
      <span class="arrow">↗</span>
    </a>

    <a class="linkcard" href="https://shitamachi-kiroku.com" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18 14 14 0 010-18z"/></svg>
      </span>
      <span class="label-group">
        <p class="label">公開中のサイトを見る</p>
        <p class="desc">shitamachi-kiroku.com</p>
      </span>
      <span class="arrow">↗</span>
    </a>

    <a class="linkcard" href="https://github.com/kimkangyoo/shitamachi-web" target="_blank" rel="noopener">
      <span class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 00-1.3-3.2 4.2 4.2 0 00-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 00-6.2 0C6.7 2.8 5.6 3.1 5.6 3.1a4.2 4.2 0 00-.1 3.2A4.6 4.6 0 004.2 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.1-.5 2V21"/></svg>
      </span>
      <span class="label-group">
        <p class="label">GitHubリポジトリ</p>
        <p class="desc">kimkangyoo/shitamachi-web</p>
      </span>
      <span class="arrow">↗</span>
    </a>
  </div>

  <p class="sec-head">業務アプリ</p>
  <div class="internal-links">
    <a href="gyomu.html">📋 業務管理</a>
    <a href="tools.html">🎬 制作ツール</a>
    <a href="shuzai.html">🎤 取材ノート</a>
    <a href="hotdog.html">🌭 飲食部門</a>
  </div>

  <footer>更新の流れ：Claude Codeで編集 → 反映 → サイトで確認</footer>
</div>

</body>
</html>
