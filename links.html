<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>リンク集｜下町きろくの動画屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Shippori Mincho',serif;background:#e8dcc8;color:#2a1a08;min-height:100vh;}

nav{background:#150c02;padding:22px 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a5218;}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.25em;color:#e8d090;text-decoration:none;}
.nav-logo span{color:#c8880a;}

.page-hero{background:#150c02;padding:64px 48px 48px;border-bottom:1px solid #3a2010;}
.page-hero-eyebrow{font-size:9px;letter-spacing:.6em;color:#8b6820;margin-bottom:14px;font-family:'Noto Sans JP',sans-serif;}
.page-hero-title{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:400;letter-spacing:.15em;color:#e8d090;}

.sec{padding:64px 48px;}
.inner{max-width:640px;margin:0 auto;}

.link-list{display:flex;flex-direction:column;gap:2px;background:#b89848;}
.link-item{background:#e8dcc8;padding:26px 30px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;transition:background .2s;}
.link-item:hover{background:#f2e8cc;}
.link-name{font-family:'Shippori Mincho',serif;font-size:17px;letter-spacing:.08em;color:#1a0e04;}
.link-desc{font-size:11px;color:#8b6820;margin-top:6px;font-family:'Noto Sans JP',sans-serif;letter-spacing:.04em;}
.link-arrow{font-size:16px;color:#8b6820;flex-shrink:0;margin-left:20px;}

footer{background:#0c0600;padding:32px 48px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-top:1px solid #2a1804;}
.foot-logo{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.25em;color:#8b6820;}
.foot-meta{font-size:10px;color:#3a2408;letter-spacing:.12em;line-height:2.4;text-align:right;font-family:'Noto Sans JP',sans-serif;}

@media(max-width:768px){
  nav{padding:16px 20px;}
  .nav-logo{font-size:16px;}
  .page-hero{padding:40px 20px 32px;}
  .sec{padding:40px 20px;}
  footer{padding:24px 20px;flex-direction:column;align-items:flex-start;}
  .foot-meta{text-align:left;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">下町きろくの<span>動画屋</span></a>
</nav>

<div class="page-hero">
  <div class="inner">
    <p class="page-hero-eyebrow">INTERNAL</p>
    <h1 class="page-hero-title">リンク集</h1>
  </div>
</div>

<section class="sec">
  <div class="inner">
    <div class="link-list">
      <a class="link-item" href="https://claude.com/claude-code" target="_blank" rel="noopener">
        <div>
          <div class="link-name">Claude Code</div>
          <div class="link-desc">開発・サイト更新に使用</div>
        </div>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-item" href="https://github.com/kimkangyoo/shitamachi-web" target="_blank" rel="noopener">
        <div>
          <div class="link-name">GitHub</div>
          <div class="link-desc">このサイトのリポジトリ</div>
        </div>
        <span class="link-arrow">→</span>
      </a>
    </div>
  </div>
</section>

<footer>
  <div class="foot-logo">下町きろくの動画屋</div>
  <div class="foot-meta">大阪市生野区 桃谷 ／ 記録映像家 K.E<br>2029年 開店予定</div>
</footer>

</body>
</html>
