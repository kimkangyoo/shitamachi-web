<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150c02">
<title>朝のルーティン｜下町きろくの動画屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#e8dcc8; --paper:#f2e8cc; --ink:#2a1a08; --ink-strong:#1a0e04;
  --gold:#8b6820; --amber:#c8880a; --line:#b89848; --dark:#150c02; --dark-line:#3a2010;
  --muted:#7a6448; --done:#6a7a38;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}

nav{background:var(--dark);padding:22px 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a5218;}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.25em;color:#e8d090;text-decoration:none;}
.nav-logo span{color:var(--amber);}
.nav-link{font-size:11px;letter-spacing:.15em;color:#c8a860;text-decoration:none;}

.hero{background:var(--dark);padding:48px 48px 40px;border-bottom:1px solid var(--dark-line);}
.inner{max-width:640px;margin:0 auto;}
.eyebrow{font-size:9px;letter-spacing:.6em;color:var(--gold);margin-bottom:12px;}
.hero-title{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:400;letter-spacing:.15em;color:#e8d090;}
.hero-date{font-family:'Shippori Mincho',serif;font-size:14px;color:#c8a860;margin-top:10px;letter-spacing:.08em;}
.hero-greet{font-size:12px;color:var(--gold);margin-top:6px;letter-spacing:.05em;}

.sec{padding:40px 48px;}
.sec + .sec{padding-top:0;}
.label{font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.15em;color:var(--ink-strong);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.label small{font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--gold);letter-spacing:.04em;}

/* 進捗 */
.status{background:var(--paper);border:1px solid var(--line);padding:22px 24px;}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.status-big{font-family:'Shippori Mincho',serif;font-size:30px;color:var(--ink-strong);}
.status-big span{font-size:14px;color:var(--gold);margin-left:4px;}
.status-sub{font-size:12px;color:var(--muted);line-height:1.8;text-align:right;}
.bar{height:6px;background:#d8c8a0;margin-top:14px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .35s;}
.status.complete .bar i{background:var(--done);}
.status-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid #7a5218;background:transparent;color:var(--gold);font-size:12px;letter-spacing:.15em;padding:10px 20px;}
.btn:hover{background:#eadbb4;}
.btn.primary{background:var(--dark);color:#e8d090;border-color:var(--dark);}
.btn.primary:hover{background:#2a1a08;}
.btn.small{padding:6px 12px;font-size:11px;letter-spacing:.08em;}
.complete-msg{display:none;margin-top:14px;font-family:'Shippori Mincho',serif;font-size:15px;color:var(--done);letter-spacing:.08em;}
.status.complete .complete-msg{display:block;}

/* リスト */
.list{display:flex;flex-direction:column;gap:2px;background:var(--line);border:1px solid var(--line);}
.item{background:var(--bg);display:flex;align-items:center;gap:14px;padding:16px 18px;user-select:none;transition:background .15s;}
.item:hover{background:var(--paper);}
.check{width:26px;height:26px;border:1.5px solid var(--gold);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;color:transparent;font-size:15px;}
.item.done .check{background:var(--done);border-color:var(--done);color:#fff;}
.item-body{flex:1;min-width:0;cursor:pointer;}
.item-name{font-family:'Shippori Mincho',serif;font-size:16px;color:var(--ink-strong);letter-spacing:.04em;word-break:break-all;}
.item.done .item-name{color:var(--muted);text-decoration:line-through;text-decoration-color:#a89878;}
.item-meta{font-size:11px;color:var(--gold);margin-top:3px;}
.item-tools{display:none;gap:4px;flex-shrink:0;}
.editing .item-tools{display:flex;}
.editing .check{display:none;}
.tool{border:1px solid #c8b080;background:var(--paper);color:var(--gold);width:30px;height:30px;font-size:13px;}
.tool:hover{background:#eadbb4;}
.tool.del{color:#a04020;}
.edit-input{width:100%;border:1px solid #c8b080;background:#fffaf0;padding:6px 8px;font-size:14px;color:var(--ink-strong);}
.edit-min{width:64px;border:1px solid #c8b080;background:#fffaf0;padding:6px 8px;font-size:13px;}
.edit-fields{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.edit-fields span{font-size:11px;color:var(--gold);}
.empty{background:var(--bg);padding:24px;font-size:13px;color:var(--muted);text-align:center;}

.add-row{display:none;margin-top:10px;gap:6px;flex-wrap:wrap;}
.editing + .add-row,.add-row.show{display:flex;}
.add-row input[type=text]{flex:1;min-width:160px;border:1px solid #c8b080;background:#fffaf0;padding:10px 12px;font-size:14px;}

/* 一言メモ */
.memo{width:100%;border:1px solid var(--line);background:var(--paper);padding:14px 16px;font-size:14px;color:var(--ink-strong);font-family:'Shippori Mincho',serif;letter-spacing:.04em;}
.memo:focus,.edit-input:focus,.edit-min:focus,.add-row input:focus{outline:2px solid var(--amber);outline-offset:-1px;}

/* 記録 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border:1px solid var(--line);margin-bottom:16px;}
.stat{background:var(--paper);padding:16px 12px;text-align:center;}
.stat b{display:block;font-family:'Shippori Mincho',serif;font-size:24px;font-weight:400;color:var(--ink-strong);}
.stat span{font-size:10px;color:var(--gold);letter-spacing:.1em;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-size:10px;color:var(--gold);text-align:center;padding-bottom:2px;}
.day{aspect-ratio:1;background:#ddd0b0;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative;cursor:default;}
.day.l1{background:#d8b870;color:var(--ink);}
.day.l2{background:#c8940a;color:#fff;}
.day.l3{background:var(--done);color:#fff;}
.day.today{outline:2px solid var(--dark);outline-offset:-2px;}
.day.blank{background:transparent;}
.legend{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--muted);}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:3px;}
.history{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.9;}
.history div{border-bottom:1px dotted #c8b080;padding:4px 0;display:flex;gap:10px;}
.history b{font-weight:400;color:var(--ink);min-width:72px;}

.backup{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#e8d090;padding:12px 22px;font-size:13px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.25s;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{background:#0c0600;padding:28px 48px;border-top:1px solid #2a1804;margin-top:24px;}
.foot-logo{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.25em;color:var(--gold);}

@media(max-width:768px){
  nav{padding:16px 16px;}
  .nav-logo{font-size:16px;}
  .hero{padding:32px 16px 28px;}
  .sec{padding:28px 16px;}
  .status-sub{text-align:left;}
  footer{padding:22px 16px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">下町きろくの<span>動画屋</span></a>
  <a href="gyomu.html" class="nav-link">業務管理 →</a>
</nav>

<div class="hero">
  <div class="inner">
    <p class="eyebrow">MORNING ROUTINE</p>
    <h1 class="hero-title">朝のルーティン</h1>
    <p class="hero-date" id="heroDate"></p>
    <p class="hero-greet" id="heroGreet"></p>
  </div>
</div>

<section class="sec">
  <div class="inner">
    <div class="status" id="status">
      <div class="status-row">
        <div class="status-big" id="progText">0<span>/ 0</span></div>
        <div class="status-sub" id="progSub"></div>
      </div>
      <div class="bar"><i id="progBar"></i></div>
      <p class="complete-msg" id="completeMsg">今朝のルーティン、完了です。いい一日を。</p>
      <div class="status-actions">
        <button class="btn primary" id="startBtn">はじめる</button>
        <button class="btn" id="resetBtn">今日のチェックを戻す</button>
      </div>
    </div>
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">やること <button class="btn small" id="editBtn">編集</button></div>
    <div class="list" id="list"></div>
    <div class="add-row" id="addRow">
      <input type="text" id="addName" placeholder="追加する項目（例：機材のバッテリー確認）" maxlength="40">
      <input type="number" id="addMin" class="edit-min" placeholder="分" min="0" max="180">
      <button class="btn primary small" id="addBtn">追加</button>
    </div>
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">今日の一言 <small>今日いちばん大事なこと</small></div>
    <input class="memo" id="memo" type="text" maxlength="80" placeholder="例：14時の撮影、早めに出る">
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">きろく <small>直近5週間</small></div>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><span>連続達成日数</span></div>
      <div class="stat"><b id="stMonth">0</b><span>今月の達成日</span></div>
      <div class="stat"><b id="stAvg">—</b><span>平均所要時間</span></div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:#ddd0b0"></i>なし</span>
      <span><i style="background:#d8b870"></i>半分未満</span>
      <span><i style="background:#c8940a"></i>半分以上</span>
      <span><i style="background:var(--done)"></i>達成</span>
    </div>
    <div class="history" id="history"></div>
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">バックアップ <small>データはこの端末のブラウザに保存されます</small></div>
    <div class="backup">
      <button class="btn small" id="exportBtn">書き出す（JSON）</button>
      <button class="btn small" id="importBtn">読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</section>

<footer><div class="foot-logo">下町きろくの動画屋</div></footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'asaRoutine';
  const DAY_START_HOUR = 4; // 朝4時で日付が切り替わる（夜更かしでも前日のまま）
  const DEFAULT_ITEMS = [
    {name:'起きたら水を一杯', min:1},
    {name:'布団をたたむ（ベッドを整える）', min:2},
    {name:'脱いだ服・タオルを決まった場所へ', min:2},
    {name:'使った食器を洗って片付ける', min:5},
    {name:'机の上を5分だけリセット', min:5},
    {name:'機材・ケーブルを定位置に戻す', min:3},
    {name:'今日の予定を確認', min:3}
  ];

  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2,9);
  const pad = n => String(n).padStart(2,'0');
  const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const routineDate = (now=new Date()) => { const d=new Date(now); d.setHours(d.getHours()-DAY_START_HOUR); return d; };
  const todayKey = () => keyOf(routineDate());
  const WD = ['日','月','火','水','木','金','土'];

  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.items)) { s.days = s.days||{}; return s; }
    }catch(e){}
    return { items: DEFAULT_ITEMS.map(x=>({id:uid(),...x})), days:{} };
  }
  let S = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('保存できませんでした（ブラウザの設定を確認）'); } }

  function today(){
    const k = todayKey();
    if(!S.days[k]) S.days[k] = { done:{}, memo:'', start:null, end:null, total:0 };
    return S.days[k];
  }
  function countDone(day){ return S.items.filter(it=>day.done[it.id]).length; }

  let editing = false;

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1800); }
  const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function renderHero(){
    const d = routineDate(), now = new Date();
    $('heroDate').textContent = d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日（'+WD[d.getDay()]+'）';
    const h = now.getHours();
    $('heroGreet').textContent = h>=4&&h<10 ? 'おはようございます。' : h<17&&h>=10 ? 'こんにちは。今朝の分、まだ間に合います。' : 'おつかれさまです。明日の朝に備えて。';
  }

  function renderStatus(){
    const day = today();
    const total = S.items.length, done = countDone(day);
    const remainMin = S.items.filter(it=>!day.done[it.id]).reduce((a,it)=>a+(+it.min||0),0);
    const allMin = S.items.reduce((a,it)=>a+(+it.min||0),0);
    $('progText').innerHTML = done+'<span>/ '+total+'</span>';
    $('progBar').style.width = total ? (done/total*100)+'%' : '0';
    const complete = total>0 && done===total;
    $('status').classList.toggle('complete', complete);
    let sub = '';
    if(complete){
      if(day.start && day.end){ const m=Math.max(1,Math.round((day.end-day.start)/60000)); sub = hm(new Date(day.start))+' 〜 '+hm(new Date(day.end))+'（'+m+'分）'; }
      else sub = '目安 '+allMin+'分';
    } else {
      sub = '残り 約'+remainMin+'分';
      if(remainMin>0) sub += '<br>今から始めて '+hm(new Date(Date.now()+remainMin*60000))+' 頃に終わる';
      if(day.start) sub += '<br>'+hm(new Date(day.start))+' にスタート';
    }
    $('progSub').innerHTML = sub;
    $('startBtn').style.display = (day.start || complete || done>0) ? 'none' : '';
  }

  function renderList(){
    const day = today(), list = $('list');
    list.classList.toggle('editing', editing);
    $('addRow').classList.toggle('show', editing);
    $('editBtn').textContent = editing ? '完了' : '編集';
    if(!S.items.length){ list.innerHTML = '<div class="empty">項目がありません。「編集」から追加してください。</div>'; return; }
    list.innerHTML = S.items.map((it,i)=>{
      const done = !!day.done[it.id];
      const body = editing
        ? '<div class="edit-fields"><input class="edit-input" data-f="name" data-id="'+it.id+'" value="'+esc(it.name)+'" maxlength="40"><input class="edit-min" type="number" min="0" max="180" data-f="min" data-id="'+it.id+'" value="'+(+it.min||0)+'"><span>分</span></div>'
        : '<div class="item-name">'+esc(it.name)+'</div><div class="item-meta">'+(+it.min||0)+'分'+(done&&day.done[it.id]>1?'　'+hm(new Date(day.done[it.id]))+' 済':'')+'</div>';
      return '<div class="item'+(done?' done':'')+'" data-id="'+it.id+'">'
        + '<button class="check" data-act="toggle" aria-label="'+esc(it.name)+'を完了">✓</button>'
        + '<div class="item-body"'+(editing?'':' data-act="toggle"')+'>'+body+'</div>'
        + '<div class="item-tools">'
        +   '<button class="tool" data-act="up" '+(i===0?'disabled style="opacity:.3"':'')+' aria-label="上へ">↑</button>'
        +   '<button class="tool" data-act="down" '+(i===S.items.length-1?'disabled style="opacity:.3"':'')+' aria-label="下へ">↓</button>'
        +   '<button class="tool del" data-act="del" aria-label="削除">×</button>'
        + '</div></div>';
    }).join('');
  }

  function renderRecord(){
    // カレンダー：今週を最終行にして5週間
    const t = routineDate(); t.setHours(12,0,0,0);
    const end = new Date(t); end.setDate(end.getDate()+(6-end.getDay()));
    const start = new Date(end); start.setDate(start.getDate()-34);
    const tk = keyOf(t);
    let html = WD.map(w=>'<div class="cal-head">'+w+'</div>').join('');
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const k = keyOf(d), r = S.days[k];
      if(d>t){ html += '<div class="day blank"></div>'; continue; }
      let cls = '', tip = k;
      if(r && r.total){
        const n = Object.keys(r.done).length, ratio = n/r.total;
        cls = ratio>=1 ? 'l3' : ratio>=.5 ? 'l2' : n>0 ? 'l1' : '';
        tip += '：'+n+'/'+r.total;
      }
      html += '<div class="day '+cls+(k===tk?' today':'')+'" title="'+tip+'">'+d.getDate()+'</div>';
    }
    $('cal').innerHTML = html;

    // 連続達成（今日が未達成なら昨日から数える）
    const isDone = k => { const r=S.days[k]; return r && r.total>0 && Object.keys(r.done).length>=r.total; };
    let streak = 0; const c = new Date(t);
    if(!isDone(keyOf(c))) c.setDate(c.getDate()-1);
    while(isDone(keyOf(c))){ streak++; c.setDate(c.getDate()-1); }
    $('stStreak').textContent = streak;
    const ym = tk.slice(0,7);
    $('stMonth').textContent = Object.keys(S.days).filter(k=>k.startsWith(ym)&&isDone(k)).length;
    const durs = Object.values(S.days).filter(r=>r.start&&r.end).map(r=>(r.end-r.start)/60000).slice(-14);
    $('stAvg').textContent = durs.length ? Math.round(durs.reduce((a,b)=>a+b,0)/durs.length)+'分' : '—';

    // 一言の履歴
    const memos = Object.keys(S.days).filter(k=>k!==tk && S.days[k].memo).sort().reverse().slice(0,5);
    $('history').innerHTML = memos.length ? memos.map(k=>{ const d=new Date(k+'T12:00'); return '<div><b>'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）</b>'+esc(S.days[k].memo)+'</div>'; }).join('') : '';
  }

  function syncTotal(){ const day=today(); day.total = S.items.length; Object.keys(day.done).forEach(id=>{ if(!S.items.some(it=>it.id===id)) delete day.done[id]; }); }
  function renderAll(){ syncTotal(); renderHero(); renderStatus(); renderList(); renderRecord(); $('memo').value = today().memo||''; }

  // 操作
  $('list').addEventListener('click', e=>{
    const btn = e.target.closest('[data-act]'); if(!btn) return;
    const row = btn.closest('.item'); if(!row) return;
    const id = row.dataset.id, i = S.items.findIndex(x=>x.id===id), act = btn.dataset.act;
    if(act==='toggle' && !editing){
      const day = today();
      if(day.done[id]) { delete day.done[id]; day.end = null; }
      else {
        day.done[id] = Date.now();
        if(!day.start) day.start = Date.now();
        if(countDone(day)===S.items.length){ day.end = Date.now(); toast('完了！おつかれさまです'); if(navigator.vibrate) try{navigator.vibrate(60);}catch(_){} }
      }
    } else if(act==='up' && i>0){ [S.items[i-1],S.items[i]]=[S.items[i],S.items[i-1]]; }
    else if(act==='down' && i<S.items.length-1){ [S.items[i+1],S.items[i]]=[S.items[i],S.items[i+1]]; }
    else if(act==='del'){ if(!confirm('「'+S.items[i].name+'」を削除しますか？')) return; S.items.splice(i,1); }
    else return;
    save(); renderAll();
  });
  $('list').addEventListener('change', e=>{
    const el = e.target; if(!el.dataset.f) return;
    const it = S.items.find(x=>x.id===el.dataset.id); if(!it) return;
    if(el.dataset.f==='name'){ const v=el.value.trim(); if(v) it.name=v; else el.value=it.name; }
    else it.min = Math.max(0, Math.min(180, parseInt(el.value,10)||0));
    save(); renderStatus();
  });
  $('editBtn').onclick = ()=>{ editing=!editing; renderList(); if(!editing) renderAll(); };
  function addItem(){
    const name = $('addName').value.trim(); if(!name){ $('addName').focus(); return; }
    S.items.push({id:uid(), name, min: Math.max(0,Math.min(180,parseInt($('addMin').value,10)||0))});
    $('addName').value=''; $('addMin').value='';
    save(); renderAll(); $('addName').focus();
  }
  $('addBtn').onclick = addItem;
  $('addName').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing) addItem(); });
  $('startBtn').onclick = ()=>{ today().start = Date.now(); save(); renderStatus(); toast('スタート。いってらっしゃい'); };
  $('resetBtn').onclick = ()=>{ if(!confirm('今日のチェックをすべて外しますか？')) return; const d=today(); d.done={}; d.start=null; d.end=null; save(); renderAll(); };
  let memoT; $('memo').addEventListener('input', e=>{ today().memo = e.target.value; clearTimeout(memoT); memoT=setTimeout(()=>{ save(); },400); });
  $('memo').addEventListener('blur', ()=>{ save(); renderRecord(); });

  $('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify({app:'asaRoutine',version:1,exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'asa-routine-'+todayKey()+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('importBtn').onclick = ()=>$('importFile').click();
  $('importFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    f.text().then(txt=>{
      const j = JSON.parse(txt), d = j.data||j;
      if(!d || !Array.isArray(d.items)) throw 0;
      if(!confirm('今のデータを読み込んだデータで置き換えますか？')) return;
      S = {items:d.items, days:d.days||{}}; save(); renderAll(); toast('読み込みました');
    }).catch(()=>toast('読み込めないファイルです')).finally(()=>{ e.target.value=''; });
  };

  // 日付の切り替わりや別タブでの変更に追従
  window.addEventListener('storage', e=>{ if(e.key===KEY){ S=load(); renderAll(); } });
  let lastKey = todayKey();
  setInterval(()=>{ if(todayKey()!==lastKey){ lastKey=todayKey(); renderAll(); } else if(!editing) renderStatus(); }, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !editing){ lastKey=todayKey(); renderAll(); } });

  renderAll(); save();
})();
</script>
</body>
</html>
