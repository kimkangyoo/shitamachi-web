<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#150c02">
<title>朝の巡回｜下町きろくの動画屋</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#e8dcc8; --paper:#f2e8cc; --ink:#2a1a08; --ink-strong:#1a0e04;
  --gold:#8b6820; --amber:#c8880a; --line:#b89848; --dark:#150c02; --dark-line:#3a2010;
  --muted:#7a6448; --ok:#6a7a38; --fix:#b8620a;
}
body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;}
button{font-family:inherit;cursor:pointer;}
input{font-family:inherit;}

nav{background:var(--dark);padding:22px 64px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #7a5218;}
.nav-logo{font-family:'Shippori Mincho',serif;font-size:20px;letter-spacing:.25em;color:#e8d090;text-decoration:none;}
.nav-logo span{color:var(--amber);}
.nav-link{font-size:11px;letter-spacing:.15em;color:#c8a860;text-decoration:none;}

.hero{background:var(--dark);padding:48px 48px 40px;border-bottom:1px solid var(--dark-line);}
.inner{max-width:640px;margin:0 auto;}
.eyebrow{font-size:9px;letter-spacing:.6em;color:var(--gold);margin-bottom:12px;}
.hero-title{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:400;letter-spacing:.15em;color:#e8d090;}
.hero-date{font-family:'Shippori Mincho',serif;font-size:14px;color:#c8a860;margin-top:10px;letter-spacing:.08em;}
.hero-greet{font-size:12px;color:var(--gold);margin-top:6px;letter-spacing:.05em;line-height:1.8;}

.sec{padding:32px 48px;}
.label{font-family:'Shippori Mincho',serif;font-size:15px;letter-spacing:.15em;color:var(--ink-strong);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.label small{font-family:'Noto Sans JP',sans-serif;font-size:11px;color:var(--gold);letter-spacing:.04em;}

.btn{border:1px solid #7a5218;background:transparent;color:var(--gold);font-size:12px;letter-spacing:.15em;padding:10px 20px;}
.btn:hover{background:#eadbb4;}
.btn.primary{background:var(--dark);color:#e8d090;border-color:var(--dark);}
.btn.primary:hover{background:#2a1a08;}
.btn.small{padding:6px 12px;font-size:11px;letter-spacing:.08em;}

/* 進捗 */
.status{background:var(--paper);border:1px solid var(--line);padding:20px 22px;position:sticky;top:0;z-index:5;}
.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;}
.status-big{font-family:'Shippori Mincho',serif;font-size:28px;color:var(--ink-strong);}
.status-big span{font-size:14px;color:var(--gold);margin-left:4px;}
.status-sub{font-size:12px;color:var(--muted);line-height:1.8;text-align:right;}
.status-sub b{color:var(--fix);font-weight:700;}
.bar{height:6px;background:#d8c8a0;margin-top:12px;overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--amber);transition:width .35s;}
.status.complete .bar i{background:var(--ok);}
.complete-msg{display:none;margin-top:12px;font-family:'Shippori Mincho',serif;font-size:15px;color:var(--ok);letter-spacing:.06em;line-height:1.7;}
.status.complete .complete-msg{display:block;}
.status-actions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;}

/* 巡回ルート */
.route{display:flex;flex-direction:column;gap:14px;}
.spot{background:var(--paper);border:1px solid var(--line);}
.spot-head{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;user-select:none;}
.spot-no{font-family:'Shippori Mincho',serif;font-size:13px;color:#e8d090;background:var(--dark);width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.spot.done .spot-no{background:var(--ok);}
.spot-name{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--ink-strong);letter-spacing:.08em;flex:1;min-width:0;}
.spot-count{font-size:11px;color:var(--gold);flex-shrink:0;}
.spot-count .fx{color:var(--fix);}
.spot-arrow{font-size:11px;color:var(--gold);transition:transform .2s;}
.spot.collapsed .spot-arrow{transform:rotate(-90deg);}
.spot.collapsed .checks{display:none;}
.checks{border-top:1px solid #d8c498;}
.chk{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:1px dotted #d8c498;}
.chk:first-child{border-top:none;}
.chk-name{flex:1;min-width:0;font-size:14px;color:var(--ink);line-height:1.5;}
.chk.ok .chk-name,.chk.fixed .chk-name{color:var(--muted);}
.chk-btns{display:flex;gap:6px;flex-shrink:0;}
.rb{border:1px solid #c8b080;background:var(--bg);color:var(--muted);font-size:12px;padding:8px 12px;min-width:58px;letter-spacing:.04em;}
.rb:hover{background:#eadbb4;}
.chk.ok .rb.ok{background:var(--ok);border-color:var(--ok);color:#fff;}
.chk.fixed .rb.fix{background:var(--fix);border-color:var(--fix);color:#fff;}
.chk.skipped .chk-name{color:var(--muted);}
.chk.skipped .rb.skip{background:#a89878;border-color:#a89878;color:#fff;}
.tool.type{font-size:11px;font-family:'Shippori Mincho',serif;}

/* 編集 */
.edit-bar{display:none;gap:6px;padding:10px 18px;border-top:1px solid #d8c498;flex-wrap:wrap;}
.editing .edit-bar{display:flex;}
.editing .chk-btns{display:none;}
.editing .spot-head{cursor:default;}
.editing .spot.collapsed .checks{display:block;}
.editing .spot-arrow{display:none;}
.tool{border:1px solid #c8b080;background:var(--bg);color:var(--gold);width:30px;height:30px;font-size:13px;flex-shrink:0;}
.tool:hover{background:#eadbb4;}
.tool.del{color:#a04020;}
.tool:disabled{opacity:.3;cursor:default;}
.edit-input{flex:1;min-width:0;border:1px solid #c8b080;background:#fffaf0;padding:6px 8px;font-size:14px;color:var(--ink-strong);}
.edit-bar input{flex:1;min-width:140px;border:1px solid #c8b080;background:#fffaf0;padding:8px 10px;font-size:13px;}
.add-spot{display:none;margin-top:12px;gap:6px;}
.add-spot.show{display:flex;}
.add-spot input{flex:1;min-width:0;border:1px solid #c8b080;background:#fffaf0;padding:10px 12px;font-size:14px;}
.edit-input:focus,.edit-bar input:focus,.add-spot input:focus,.memo:focus{outline:2px solid var(--amber);outline-offset:-1px;}
.empty{background:var(--paper);border:1px solid var(--line);padding:24px;font-size:13px;color:var(--muted);text-align:center;}

.memo{width:100%;border:1px solid var(--line);background:var(--paper);padding:14px 16px;font-size:14px;color:var(--ink-strong);font-family:'Shippori Mincho',serif;letter-spacing:.04em;}

/* 記録 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--line);border:1px solid var(--line);margin-bottom:16px;}
.stat{background:var(--paper);padding:16px 10px;text-align:center;}
.stat b{display:block;font-family:'Shippori Mincho',serif;font-size:24px;font-weight:400;color:var(--ink-strong);}
.stat span{font-size:10px;color:var(--gold);letter-spacing:.06em;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-head{font-size:10px;color:var(--gold);text-align:center;padding-bottom:2px;}
.day{aspect-ratio:1;background:#ddd0b0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);line-height:1.2;}
.day small{font-size:9px;}
.day.part{background:#d8b870;color:var(--ink);}
.day.full{background:var(--ok);color:#fff;}
.day.today{outline:2px solid var(--dark);outline-offset:-2px;}
.day.blank{background:transparent;}
.legend{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:10px;color:var(--muted);flex-wrap:wrap;}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:3px;}
.sub-label{font-family:'Shippori Mincho',serif;font-size:13px;color:var(--ink-strong);letter-spacing:.1em;margin:22px 0 10px;}
.rank div{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dotted #c8b080;font-size:13px;}
.rank .rk-name{flex:1;min-width:0;}
.rank .rk-name small{display:block;font-size:11px;color:var(--muted);}
.rank .rk-bar{width:90px;height:6px;background:#ddd0b0;flex-shrink:0;}
.rank .rk-bar i{display:block;height:100%;background:var(--fix);}
.rank .rk-n{width:36px;text-align:right;font-size:12px;color:var(--fix);flex-shrink:0;}
.note{font-size:12px;color:var(--muted);line-height:1.9;}
.history div{border-bottom:1px dotted #c8b080;padding:5px 0;display:flex;gap:10px;font-size:12px;color:var(--muted);line-height:1.7;}
.history b{font-weight:400;color:var(--ink);min-width:72px;flex-shrink:0;}

.backup{display:flex;gap:8px;flex-wrap:wrap;}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--dark);color:#e8d090;padding:12px 22px;font-size:13px;letter-spacing:.06em;opacity:0;pointer-events:none;transition:.25s;z-index:10;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

footer{background:#0c0600;padding:28px 48px;border-top:1px solid #2a1804;margin-top:24px;}
.foot-logo{font-family:'Shippori Mincho',serif;font-size:14px;letter-spacing:.25em;color:var(--gold);}

@media(max-width:768px){
  nav{padding:16px 16px;}
  .nav-logo{font-size:16px;}
  .hero{padding:32px 16px 28px;}
  .sec{padding:24px 16px;}
  .status{padding:14px 16px;}
  .status-big{font-size:24px;}
  .spot-head,.chk,.edit-bar{padding-left:14px;padding-right:14px;}
  .rb{min-width:52px;padding:8px 10px;}
  footer{padding:22px 16px;}
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">下町きろくの<span>動画屋</span></a>
  <a href="gyomu.html" class="nav-link">業務管理 →</a>
</nav>

<div class="hero">
  <div class="inner">
    <p class="eyebrow">MORNING PATROL</p>
    <h1 class="hero-title">朝の巡回</h1>
    <p class="hero-date" id="heroDate"></p>
    <p class="hero-greet">起きたら、家をひと回り。<br>やらかしは、その場で直せばなかったことになる。</p>
  </div>
</div>

<section class="sec">
  <div class="inner">
    <div class="status" id="status">
      <div class="status-row">
        <div class="status-big" id="progText">0<span>/ 0</span></div>
        <div class="status-sub" id="progSub"></div>
      </div>
      <div class="bar"><i id="progBar"></i></div>
      <p class="complete-msg" id="completeMsg"></p>
      <div class="status-actions" id="statusActions">
        <button class="btn small" id="resetBtn">今日の巡回をやり直す</button>
      </div>
    </div>
  </div>
</section>

<section class="sec" style="padding-top:0">
  <div class="inner">
    <div class="label">巡回ルート <button class="btn small" id="editBtn">ルートを編集</button></div>
    <p class="note" style="margin-bottom:12px" id="howto">確認する項目は「問題なし」か「直した」、やることは「やった」か「今日はなし」を押してください。直した数は記録に残ります。</p>
    <div class="route" id="route"></div>
    <div class="add-spot" id="addSpot">
      <input type="text" id="addSpotName" placeholder="場所を追加（例：ベランダ）" maxlength="20">
      <button class="btn primary small" id="addSpotBtn">追加</button>
    </div>
  </div>
</section>

<section class="sec" style="padding-top:0">
  <div class="inner">
    <div class="label">メモ <small>気づいたこと・今日気をつけること</small></div>
    <input class="memo" id="memo" type="text" maxlength="80" placeholder="例：ソファに上着を置きがち">
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">きろく <small>直近5週間</small></div>
    <div class="stats">
      <div class="stat"><b id="stStreak">0</b><span>連続巡回日数</span></div>
      <div class="stat"><b id="stMonth">0</b><span>今月の巡回日</span></div>
      <div class="stat"><b id="stFix">0</b><span>今月直した数</span></div>
    </div>
    <div class="cal" id="cal"></div>
    <div class="legend">
      <span><i style="background:#ddd0b0"></i>なし</span>
      <span><i style="background:#d8b870"></i>途中まで</span>
      <span><i style="background:var(--ok)"></i>巡回完了</span>
      <span>数字の下＝直した数</span>
    </div>

    <p class="sub-label">よくやらかすところ（30日）</p>
    <div class="rank" id="rank"></div>

    <p class="sub-label">メモの履歴</p>
    <div class="history" id="history"></div>
  </div>
</section>

<section class="sec">
  <div class="inner">
    <div class="label">バックアップ <small>データはこの端末のブラウザに保存されます</small></div>
    <div class="backup">
      <button class="btn small" id="exportBtn">書き出す（JSON）</button>
      <button class="btn small" id="importBtn">読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
  </div>
</section>

<footer><div class="foot-logo">下町きろくの動画屋</div></footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  const KEY = 'asaPatrol';
  const DAY_START_HOUR = 4; // 朝4時で日付が切り替わる
  // 先頭が「!」の項目は「やること」（ボタンが「やった／今日はなし」になる）
  const DEFAULT_ROUTE = [
    ['部屋', ['飲んだペットボトル・お菓子がそのままになっていない','脱いだ服がそのままになっていない','!脱いだ服や靴下を洗たくコーナーに持っていく','部屋にゴミが落ちていない']],
    ['机', ['机の上にゴミがない','机の上にコップなどが残っていない']],
    ['キッチン', ['シンクに洗い物が残っていない','ガス湯沸かし器の電源が切れている']],
    ['玄関', ['玄関に何か置きっぱなしになっていない']],
    ['外', ['!ゴミ出し','!公園を歩く']]
  ];

  const $ = id => document.getElementById(id);
  const uid = () => Math.random().toString(36).slice(2,9);
  const pad = n => String(n).padStart(2,'0');
  const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  const routineDate = () => { const d=new Date(); d.setHours(d.getHours()-DAY_START_HOUR); return d; };
  const todayKey = () => keyOf(routineDate());
  const WD = ['日','月','火','水','木','金','土'];
  const hm = d => pad(d.getHours())+':'+pad(d.getMinutes());
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function defaults(){
    return { spots: DEFAULT_ROUTE.map(([name,checks])=>({id:uid(), name, checks:checks.map(c=>c[0]==='!' ? {id:uid(), name:c.slice(1), type:'do'} : {id:uid(), name:c})})), days:{} };
  }
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY));
      if(s && Array.isArray(s.spots)){ s.days = s.days||{}; return s; }
    }catch(e){}
    return defaults();
  }
  let S = load();
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('保存できませんでした（ブラウザの設定を確認）'); } }

  const allChecks = () => S.spots.flatMap(sp=>sp.checks.map(c=>({...c, spot:sp})));
  function today(){
    const k = todayKey();
    if(!S.days[k]) S.days[k] = { res:{}, memo:'', start:null, end:null, total:0, names:{} };
    return S.days[k];
  }
  // 日ごとに「どの場所の何を直したか」を名前で残しておく（ルートを編集しても記録が崩れないように）
  function syncDay(){
    const d = today(), ids = new Set(allChecks().map(c=>c.id));
    Object.keys(d.res).forEach(id=>{ if(!ids.has(id)) { delete d.res[id]; delete d.names[id]; } });
    d.total = ids.size;
    allChecks().forEach(c=>{ if(d.res[c.id]) d.names[c.id] = [c.spot.name, c.name]; });
  }
  const answered = d => Object.keys(d.res).length;
  const fixedCount = d => Object.values(d.res||{}).filter(r=>r.v==='fix').length;

  let editing = false;
  const openSpots = new Set();

  function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2000); }

  function renderStatus(){
    const d = today(), total = d.total, n = answered(d), fx = fixedCount(d);
    $('heroDate').textContent = (()=>{ const r=routineDate(); return r.getFullYear()+'年'+(r.getMonth()+1)+'月'+r.getDate()+'日（'+WD[r.getDay()]+'）'; })();
    $('progText').innerHTML = n+'<span>/ '+total+'</span>';
    $('progBar').style.width = total ? (n/total*100)+'%' : '0';
    const complete = total>0 && n>=total;
    $('status').classList.toggle('complete', complete);
    let sub = '直した：<b>'+fx+'</b>';
    if(d.start) sub += '<br>'+hm(new Date(d.start))+(complete&&d.end ? ' 〜 '+hm(new Date(d.end))+'（'+Math.max(1,Math.round((d.end-d.start)/60000))+'分）' : ' 開始');
    $('progSub').innerHTML = sub;
    $('completeMsg').textContent = !complete ? '' : fx===0 ? '巡回完了。今朝はやらかしゼロ。' : '巡回完了。'+fx+'か所を直しました。これで家はリセット済みです。';
    $('statusActions').style.display = n>0 ? '' : 'none';
  }

  function renderRoute(){
    const d = today(), route = $('route');
    route.classList.toggle('editing', editing);
    $('addSpot').classList.toggle('show', editing);
    $('editBtn').textContent = editing ? '編集を終える' : 'ルートを編集';
    $('howto').style.display = editing ? 'none' : '';
    if(!S.spots.length){ route.innerHTML = '<div class="empty">巡回する場所がありません。「ルートを編集」から追加してください。</div>'; return; }
    // 最初の未完了の場所を自動で開く
    const firstOpen = S.spots.find(sp=>sp.checks.some(c=>!d.res[c.id]));
    route.innerHTML = S.spots.map((sp,i)=>{
      const n = sp.checks.filter(c=>d.res[c.id]).length, fx = sp.checks.filter(c=>d.res[c.id]&&d.res[c.id].v==='fix').length;
      const done = sp.checks.length>0 && n===sp.checks.length;
      const open = openSpots.has(sp.id) || (!done && sp===firstOpen);
      const head = editing
        ? '<span class="spot-no">'+(i+1)+'</span><input class="edit-input" data-f="spot" data-sp="'+sp.id+'" value="'+esc(sp.name)+'" maxlength="20">'
          + '<button class="tool" data-act="sup" '+(i===0?'disabled':'')+' aria-label="上へ">↑</button>'
          + '<button class="tool" data-act="sdown" '+(i===S.spots.length-1?'disabled':'')+' aria-label="下へ">↓</button>'
          + '<button class="tool del" data-act="sdel" aria-label="場所を削除">×</button>'
        : '<span class="spot-no">'+(done?'✓':i+1)+'</span><span class="spot-name">'+esc(sp.name)+'</span>'
          + '<span class="spot-count">'+n+'/'+sp.checks.length+(fx?' <span class="fx">直'+fx+'</span>':'')+'</span><span class="spot-arrow">▼</span>';
      const checks = sp.checks.map(c=>{
        const r = d.res[c.id], st = r ? ({fix:'fixed',skip:'skipped'}[r.v]||'ok') : '';
        if(editing) return '<div class="chk"><input class="edit-input" data-f="chk" data-sp="'+sp.id+'" data-c="'+c.id+'" value="'+esc(c.name)+'" maxlength="40">'
          + '<button class="tool type" data-act="ctype" data-c="'+c.id+'" title="確認する項目／やること を切り替え">'+(c.type==='do'?'行':'確')+'</button>'
          + '<button class="tool del" data-act="cdel" data-c="'+c.id+'" aria-label="項目を削除">×</button></div>';
        const btns = c.type==='do'
          ? '<button class="rb ok" data-act="done">やった</button><button class="rb skip" data-act="skip">今日はなし</button>'
          : '<button class="rb ok" data-act="ok">問題なし</button><button class="rb fix" data-act="fix">直した</button>';
        return '<div class="chk '+st+'" data-c="'+c.id+'"><span class="chk-name">'+esc(c.name)+'</span><span class="chk-btns">'+btns+'</span></div>';
      }).join('');
      const editBar = '<div class="edit-bar"><input type="text" placeholder="チェック項目を追加" maxlength="40" data-add="'+sp.id+'"><button class="btn primary small" data-act="cadd">追加</button></div>';
      return '<div class="spot'+(done?' done':'')+(open?'':' collapsed')+'" data-sp="'+sp.id+'">'
        + '<div class="spot-head"'+(editing?'':' data-act="toggle"')+'>'+head+'</div>'
        + '<div class="checks">'+checks+'</div>'+editBar+'</div>';
    }).join('');
  }

  function renderRecord(){
    const t = routineDate(); t.setHours(12,0,0,0);
    const tk = keyOf(t);
    const end = new Date(t); end.setDate(end.getDate()+(6-end.getDay()));
    const start = new Date(end); start.setDate(start.getDate()-34);
    let html = WD.map(w=>'<div class="cal-head">'+w+'</div>').join('');
    for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
      const k = keyOf(d), r = S.days[k];
      if(d>t){ html += '<div class="day blank"></div>'; continue; }
      let cls = '', fx = '';
      if(r && r.total){ const n=answered(r); cls = n>=r.total ? 'full' : n>0 ? 'part' : ''; const f=fixedCount(r); if(n>0) fx = '<small>'+f+'</small>'; }
      html += '<div class="day '+cls+(k===tk?' today':'')+'" title="'+k+'">'+d.getDate()+fx+'</div>';
    }
    $('cal').innerHTML = html;

    const isDone = k => { const r=S.days[k]; return r && r.total>0 && answered(r)>=r.total; };
    let streak = 0; const c = new Date(t);
    if(!isDone(keyOf(c))) c.setDate(c.getDate()-1);
    while(isDone(keyOf(c))){ streak++; c.setDate(c.getDate()-1); }
    $('stStreak').textContent = streak;
    const ym = tk.slice(0,7), monthKeys = Object.keys(S.days).filter(k=>k.startsWith(ym));
    $('stMonth').textContent = monthKeys.filter(isDone).length;
    $('stFix').textContent = monthKeys.reduce((a,k)=>a+fixedCount(S.days[k]),0);

    // 30日ランキング（項目単位）
    const since = new Date(t); since.setDate(since.getDate()-29); const sk = keyOf(since);
    const tally = {};
    Object.keys(S.days).filter(k=>k>=sk && k<=tk).forEach(k=>{
      const r = S.days[k];
      Object.entries(r.res||{}).forEach(([id,v])=>{ if(v.v!=='fix') return; const nm=(r.names||{})[id]; if(!nm) return; const key=nm[0]+'\u0000'+nm[1]; tally[key]=(tally[key]||0)+1; });
    });
    const top = Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const max = top.length ? top[0][1] : 1;
    $('rank').innerHTML = top.length ? top.map(([k,n])=>{ const [sp,ch]=k.split('\u0000'); return '<div><span class="rk-name">'+esc(ch)+'<small>'+esc(sp)+'</small></span><span class="rk-bar"><i style="width:'+(n/max*100)+'%"></i></span><span class="rk-n">'+n+'回</span></div>'; }).join('')
      : '<p class="note">まだ記録がありません。「直した」を押すと、ここに多い順で並びます。<br>ここに出てくる場所に、ゴミ箱や服のカゴを置くと効きます。</p>';

    const memos = Object.keys(S.days).filter(k=>k!==tk && S.days[k].memo).sort().reverse().slice(0,5);
    $('history').innerHTML = memos.length ? memos.map(k=>{ const d=new Date(k+'T12:00'); return '<div><b>'+(d.getMonth()+1)+'/'+d.getDate()+'（'+WD[d.getDay()]+'）</b>'+esc(S.days[k].memo)+'</div>'; }).join('') : '<p class="note">まだありません。</p>';
  }

  function renderAll(){ syncDay(); renderStatus(); renderRoute(); renderRecord(); if(document.activeElement!==$('memo')) $('memo').value = today().memo||''; }

  $('route').addEventListener('click', e=>{
    const btn = e.target.closest('[data-act]'); if(!btn) return;
    const spEl = btn.closest('.spot'); if(!spEl) return;
    const sp = S.spots.find(x=>x.id===spEl.dataset.sp), i = S.spots.indexOf(sp), act = btn.dataset.act;
    if(act==='toggle'){
      if(spEl.classList.contains('collapsed')) openSpots.add(sp.id); else { openSpots.delete(sp.id); spEl.classList.add('collapsed'); return; }
      renderRoute(); return;
    }
    if(act==='ok' || act==='fix' || act==='done' || act==='skip'){
      const cid = btn.closest('.chk').dataset.c, d = today(), v = act;
      if(d.res[cid] && d.res[cid].v===v) delete d.res[cid];
      else d.res[cid] = {v, t:Date.now()};
      if(!d.start) d.start = Date.now();
      syncDay();
      const complete = answered(d)>=d.total;
      if(complete && !d.end){ d.end = Date.now(); toast('巡回完了。おつかれさまでした'); try{navigator.vibrate&&navigator.vibrate(60);}catch(_){} window.scrollTo({top:0,behavior:'smooth'}); }
      if(!complete) d.end = null;
      // 場所を回り終えたら閉じて次へ
      if(sp.checks.every(c=>d.res[c.id])) openSpots.delete(sp.id);
    }
    else if(act==='sup' && i>0){ [S.spots[i-1],S.spots[i]]=[S.spots[i],S.spots[i-1]]; }
    else if(act==='sdown' && i<S.spots.length-1){ [S.spots[i+1],S.spots[i]]=[S.spots[i],S.spots[i+1]]; }
    else if(act==='sdel'){ if(!confirm('「'+sp.name+'」をルートから外しますか？')) return; S.spots.splice(i,1); }
    else if(act==='cdel'){ const c=sp.checks.find(x=>x.id===btn.dataset.c); if(!confirm('「'+c.name+'」を削除しますか？')) return; sp.checks=sp.checks.filter(x=>x!==c); }
    else if(act==='ctype'){ const c=sp.checks.find(x=>x.id===btn.dataset.c); if(c.type==='do') delete c.type; else c.type='do'; const r=today().res[c.id]; if(r) delete today().res[c.id]; }
    else if(act==='cadd'){ addCheck(spEl, sp); return; }
    else return;
    save(); renderAll();
  });
  function addCheck(spEl, sp){
    const inp = spEl.querySelector('[data-add]'), v = inp.value.trim(); if(!v){ inp.focus(); return; }
    sp.checks.push({id:uid(), name:v}); save(); renderAll();
    const again = document.querySelector('[data-add="'+sp.id+'"]'); if(again) again.focus();
  }
  $('route').addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.isComposing) return;
    if(e.target.dataset.add){ const spEl=e.target.closest('.spot'); addCheck(spEl, S.spots.find(x=>x.id===spEl.dataset.sp)); }
    else if(e.target.classList.contains('edit-input')) e.target.blur();
  });
  $('route').addEventListener('change', e=>{
    const el = e.target, f = el.dataset.f; if(!f) return;
    const sp = S.spots.find(x=>x.id===el.dataset.sp); if(!sp) return;
    const v = el.value.trim();
    if(f==='spot'){ if(v) sp.name=v; else el.value=sp.name; }
    if(f==='chk'){ const c=sp.checks.find(x=>x.id===el.dataset.c); if(c){ if(v) c.name=v; else el.value=c.name; } }
    save();
  });
  $('editBtn').onclick = ()=>{ editing=!editing; if(document.activeElement) document.activeElement.blur(); renderAll(); };
  function addSpot(){
    const v = $('addSpotName').value.trim(); if(!v){ $('addSpotName').focus(); return; }
    S.spots.push({id:uid(), name:v, checks:[{id:uid(), name:'ゴミ・服・開けっぱなしがない'}]});
    $('addSpotName').value=''; save(); renderAll();
  }
  $('addSpotBtn').onclick = addSpot;
  $('addSpotName').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.isComposing) addSpot(); });
  $('resetBtn').onclick = ()=>{ if(!confirm('今日の巡回チェックをすべて外しますか？')) return; const d=today(); d.res={}; d.names={}; d.start=null; d.end=null; openSpots.clear(); save(); renderAll(); };
  let memoT; $('memo').addEventListener('input', e=>{ today().memo = e.target.value; clearTimeout(memoT); memoT=setTimeout(save,400); });
  $('memo').addEventListener('blur', ()=>{ save(); renderRecord(); });

  $('exportBtn').onclick = ()=>{
    const blob = new Blob([JSON.stringify({app:'asaPatrol',version:1,exportedAt:new Date().toISOString(),data:S},null,2)],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'asa-patrol-'+todayKey()+'.json'; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };
  $('importBtn').onclick = ()=>$('importFile').click();
  $('importFile').onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    f.text().then(txt=>{
      const j = JSON.parse(txt), d = j.data||j;
      if(!d || !Array.isArray(d.spots)) throw 0;
      if(!confirm('今のデータを読み込んだデータで置き換えますか？')) return;
      S = {spots:d.spots, days:d.days||{}}; save(); renderAll(); toast('読み込みました');
    }).catch(()=>toast('読み込めないファイルです')).finally(()=>{ e.target.value=''; });
  };

  window.addEventListener('storage', e=>{ if(e.key===KEY && !editing){ S=load(); renderAll(); } });
  let lastKey = todayKey();
  const refreshIfNewDay = ()=>{ if(todayKey()!==lastKey && !editing){ lastKey=todayKey(); openSpots.clear(); renderAll(); } };
  setInterval(refreshIfNewDay, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refreshIfNewDay(); });

  renderAll(); save();
})();
</script>
</body>
</html>
